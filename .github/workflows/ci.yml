# Production-grade CI for TruthBounty Frontend
# Enforces Lint, Tests, Accessibility (A11y), Contract Verification, and Production Build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-validation:
    name: Workflow Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate workflow YAML and reject duplicate keys
        run: ruby scripts/verify-workflow-syntax.rb

  providers:
    name: CSP and provider drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: pnpm verify:providers
      - run: pnpm test:providers
      # Credentialed production coverage runs separately in csp-rehearsal.yml.
      # A green fork gate proves static obligations, not live provider usage.

  artifacts:
    name: Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify contract release artifacts (drift fails here)
        run: node scripts/verify-artifacts.mjs
      - name: Scan source and release inputs for public-boundary leaks
        run: node scripts/secret-scan.mjs src release next.config.ts
      - name: Verify fixture determinism (nondeterministic clocks/random ids fail here)
        run: |
          node scripts/verify-fixture-determinism.mjs
          node --test scripts/__tests__/verify-fixture-determinism.test.mjs

  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm lint

  token-drift:
    name: Design-Token Drift Gate (UI-FE-091)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run token-drift static check
        run: node scripts/check-token-drift.mjs --report-file reports/token-drift-report.json
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: token-drift-report
          path: reports/token-drift-report.json
          retention-days: 30

  board-conformity:
    name: Approved-Board Conformity & Visual Evidence (UI-FE-093)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify approved-board conformity and generate review bundle
        run: node scripts/verify-board-conformity.mjs --generate-bundle --report-file reports/board-conformity-bundle.json --markdown-summary reports/board-conformity-summary.md
      - name: Run conformity unit tests
        run: node --test scripts/__tests__/verify-board-conformity.test.mjs
      - name: Upload board conformity evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: board-conformity-bundle
          path: |
            reports/board-conformity-bundle.json
            reports/board-conformity-summary.md
          retention-days: 30

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Run TypeScript check
        run: pnpm type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Run unit and integration tests
        run: pnpm test


  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify accessibility gate and state coverage
        run: pnpm verify:accessibility
      - name: Run accessibility tests
        run: pnpm test:a11y

  build:
    name: Production Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CHAIN_ID: ${{ vars.NEXT_PUBLIC_CHAIN_ID }}
      NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      NEXT_PUBLIC_EXPLORER_BASE_URL: ${{ vars.NEXT_PUBLIC_EXPLORER_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Preflight production configuration
        run: node scripts/verify-ci-production-env.mjs
      - name: Install dependencies
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Build production app
        run: pnpm build
      - name: Upload production build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-build
          path: .next/
          retention-days: 1

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build, typecheck, test, accessibility, token-drift, board-conformity]
    env:
      NEXT_PUBLIC_CHAIN_ID: ${{ vars.NEXT_PUBLIC_CHAIN_ID }}
      NEXT_PUBLIC_RPC_URL: ${{ vars.NEXT_PUBLIC_RPC_URL }}
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      NEXT_PUBLIC_EXPLORER_BASE_URL: ${{ vars.NEXT_PUBLIC_EXPLORER_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Preflight production configuration
        run: node scripts/verify-ci-production-env.mjs
      - name: Install dependencies
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Download production build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: production-build
          path: .next/
      - name: Scan browser bundles, source maps, HTML, and RSC payloads
        run: node scripts/secret-scan.mjs .next
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chrome
      - name: Run E2E tests (including deployment-preview verification)
        env:
          E2E_HARNESS: "1"
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  preview-verification:
    name: Deployment Preview Verification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Run deployment-preview unit tests (V2-FE-064)
        run: pnpm exec jest --runInBand src/lib/deployment src/components/preview
      - name: Verify no hardcoded secret values in deployment preview modules
        # Scans for actual high-entropy secret VALUES (64-hex private keys, sk_live_ tokens)
        # NOT for the word "secret" in comments or variable names — those are legitimate.
        run: node scripts/verify-production-boundaries.mjs source --root .
